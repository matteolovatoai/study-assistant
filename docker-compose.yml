services:
  # ==========================================
  # BACKEND (FastAPI + ChromaDB)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-assistant-backend
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - proxy_network
    labels:
      - "traefik.enable=true"
      # Rotta per il Backend: risponde sul tuo dominio Tailscale MA SOLO se l'URL inizia con /api
      - "traefik.http.routers.backend.rule=Host(`iris.tailbd69cc.ts.net`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=tsresolver"
    restart: unless-stopped

  # ==========================================
  # FRONTEND (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-assistant-frontend
    depends_on:
      - backend
    networks:
      - proxy_network
    labels:
      - "traefik.enable=true"
      # Rotta per il Frontend: risponde a tutto il resto sul tuo dominio
      - "traefik.http.routers.frontend.rule=Host(`iris.tailbd69cc.ts.net`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=tsresolver"
    restart: unless-stopped

# Diciamo a Docker Compose di non creare una nuova rete, ma di agganciarsi
# a quella 'proxy_network' creata dal tuo Traefik globale!
networks:
  proxy_network:
    external: true

volumes:
  chroma_data:
    name: study_assistant_chroma_data
