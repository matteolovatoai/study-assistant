services:
  # ==========================================
  # BACKEND (FastAPI + ChromaDB)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-assistant-backend
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - proxy_network
    labels:
      - "traefik.enable=true"
      # Rotta per il Backend: intercetta /study-assistant/api
      - "traefik.http.routers.backend.rule=Host(`iris.tailbd69cc.ts.net`) && PathPrefix(`/study-assistant/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=tsresolver"
      # Middleware per rimuovere '/study-assistant' prima di inviarlo a FastAPI (così FastAPI vede solo /api/...)
      - "traefik.http.middlewares.study-strip.stripprefix.prefixes=/study-assistant"
      - "traefik.http.routers.backend.middlewares=study-strip"
    restart: unless-stopped

  # ==========================================
  # FRONTEND (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-assistant-frontend
    depends_on:
      - backend
    networks:
      - proxy_network
    labels:
      - "traefik.enable=true"
      # Rotta per il Frontend: intercetta tutto ciò che inizia con /study-assistant (escluso l'api che viene catturato prima)
      - "traefik.http.routers.frontend.rule=Host(`iris.tailbd69cc.ts.net`) && PathPrefix(`/study-assistant`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=tsresolver"
    restart: unless-stopped

# Diciamo a Docker Compose di non creare una nuova rete, ma di agganciarsi
# a quella 'proxy_network' creata dal tuo Traefik globale!
networks:
  proxy_network:
    external: true

volumes:
  chroma_data:
    name: study_assistant_chroma_data
